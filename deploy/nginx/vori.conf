# VORI Nginx 설정 초안 — 프론트(빌드 결과)와 /api(백엔드)를 한 도메인으로 묶는다.
# 놓을 곳: /etc/nginx/conf.d/vori.conf (Amazon Linux) 또는 /etc/nginx/sites-available/ + 링크 (Ubuntu)
# 바꿀 것: vori.example.com → 실제 도메인, 인증서 경로(certbot 이 만든 경로)
#
# 한 도메인으로 묶는 이유
# - 백엔드 CORS(SecurityConfig)가 localhost 만 허용한다. 같은 도메인이면 CORS 가 필요 없다.
# - 프론트는 REACT_APP_API_BASE 없이 빌드하면 "/api" 로 부른다(frontend/src/api/base.js).
# - 세션 쿠키(SameSite=Lax)가 같은 사이트 요청에만 붙는다.

# http → https
server {
    listen 80;
    server_name vori.example.com;
    # certbot 갱신용 경로는 http 로 열어 둔다
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    # Nginx 1.25.1 이전이면 이 줄을 지우고 위를 "listen 443 ssl http2;" 로
    http2 on;
    server_name vori.example.com;

    ssl_certificate     /etc/letsencrypt/live/vori.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vori.example.com/privkey.pem;

    # 영수증 사진 업로드 — 서버 상한이 10MB(요청 11MB, application.properties).
    # Nginx 기본값은 1MB 라 그대로 두면 사진이 413 으로 막힌다.
    client_max_body_size 11m;

    # 프론트 — frontend 에서 npm run build 한 build/ 를 여기에 복사한다
    root /var/www/vori;
    index index.html;

    # 화면 주소(/home, /wallet …)는 파일이 아니라 React 라우터가 그린다.
    # 없는 파일이면 index.html 을 줘야 새로고침·주소 직접 입력이 404 가 아니다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 빌드 파일 이름에 해시가 붙어(main.abc123.js) 오래 캐시해도 된다. index.html 은 캐시하지 않는다.
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gemini 를 기다리는 요청(펫 대화·사유 분류·영수증 인식)은 서버가 재시도·대체 모델까지
        # 최악 글 약 3분, 영수증 약 6분을 기다린다(GeminiClient). Nginx 기본 60초면 그 전에 504 가 난다.
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
