# vori.worldpick.co.kr — VORI (React 정적 빌드 + Spring Boot API)
# 서버 설치 경로: zzemsoft:/home/dockers/nginx/conf.d/vori.worldpick.co.kr.conf
#
#   /        프론트 — /data/home2/vori.worldpick.co.kr/VORI/frontend/build 를 nginx 가 직접 서빙
#            (nginx 컨테이너에 /data/home2 가 bind 되어 있음. deploy.sh 가 재빌드하면 reload 없이 바로 반영)
#   /api/    백엔드 — vori-backend:8080 (compose project vori, 공유망 dockers_backend. 호스트 포트 미공개)
#
# 컨테이너 재생성으로 IP 가 바뀌어도 reload 없이 Docker DNS 를 다시 조회하도록 resolver + 변수 proxy_pass 패턴.
#
# 인증서(최초 1회, 80 포트 ACME 는 00-default.conf 가 이미 응답):
#   docker run --rm -v /home/dockers/certbot/conf:/etc/letsencrypt -v /home/dockers/certbot/logs:/var/log/letsencrypt \
#     -v /home/dockers/certbot/data:/var/www/certbot certbot/certbot certonly --webroot --webroot-path=/var/www/certbot \
#     --email zzemsoft@gmail.com --agree-tos --no-eff-email -d vori.worldpick.co.kr
# 갱신: root crontab 03:30 /home/dockers/certbot_renew.sh (certbot renew 전체 + nginx reload)

server {
    listen 80;
    listen [::]:80;
    server_name vori.worldpick.co.kr;
    location ~ /.well-known/acme-challenge { allow all; root /var/www/certbot; }
    location / { return 301 https://vori.worldpick.co.kr$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name vori.worldpick.co.kr;

    ssl_certificate     /etc/letsencrypt/live/vori.worldpick.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vori.worldpick.co.kr/privkey.pem;
    # .co.kr 은 HTTPS 가 자동 강제되지 않는다. 직접 건다.
    # (add_header 는 자체 add_header 가 있는 location 에 상속되지 않으므로 그런 곳에는 다시 적는다.)
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    error_log  /var/log/nginx/vori.worldpick.co.kr-error.log;
    access_log /var/log/nginx/vori.worldpick.co.kr-access.log;

    # 영수증 사진 업로드 — 서버 상한 10MB(요청 11MB, application.properties). 기본 1MB 면 413.
    client_max_body_size 11m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $vori_api vori-backend:8080;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    root /data/home2/vori.worldpick.co.kr/VORI/frontend/build;
    index index.html;

    location ~ /.well-known/acme-challenge { allow all; root /var/www/certbot; }

    # 화면 주소(/home, /wallet …)는 React 라우터가 그린다. 없는 파일이면 index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 은 캐시하지 않는다(새 배포가 바로 보이게). try_files 폴백도 여기로 온다.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }

    # 빌드 파일 이름에 해시가 붙어(main.abc123.js) 오래 캐시해도 된다.
    location ^~ /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://$vori_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        # Gemini 를 기다리는 요청(펫 대화·사유 분류·영수증 인식)은 최악 약 6분(GeminiClient). 기본 60초면 504.
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
    }
}
