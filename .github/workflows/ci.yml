# PR 과 main 푸시마다 백엔드 테스트·프론트 빌드를 돌리고,
# 이미 머지된 Flyway 마이그레이션이 바뀌지 않았는지 확인한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR 에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Flyway 는 주석까지 체크섬에 넣는다. 이미 머지된 V 파일을 고치면
  # 그 마이그레이션이 적용된 DB 에서 서버가 뜨지 않는다(#109).
  # backend 잡은 매번 빈 DB 로 돌아서 이 문제를 못 잡으므로 따로 검사한다.
  migrations-unchanged:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 머지된 마이그레이션 수정·삭제·이름 변경 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "$BASE_SHA"...HEAD -- backend/src/main/resources/db/migration/)
          if [ -n "$changed" ]; then
            echo "::error::이미 머지된 마이그레이션이 바뀌었습니다. 주석 한 줄도 체크섬을 바꿉니다. 고칠 내용은 새 V 파일로 추가하세요."
            echo "$changed"
            exit 1
          fi
          echo "머지된 마이그레이션 변경 없음"

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: vori
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # .env 가 없으니 application.properties 의 환경변수로 DB 접속 정보를 넘긴다.
      # Gemini·Google 키는 비워 둔다 — 테스트는 외부 API 를 호출하지 않는다.
      - name: 테스트
        env:
          DB_USERNAME: root
          DB_PASSWORD: ci
        run: ./gradlew test --no-daemon
      - name: 테스트 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 팀 Node 버전은 frontend/.nvmrc 한 곳에서 정한다 — 로컬과 CI 가 같은 버전을 쓰게
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # GitHub Actions 는 CI=true 라 ESLint 경고도 빌드 실패로 처리된다.
      - name: 빌드
        run: npm run build
