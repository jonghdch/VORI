# Docker 로컬 실행용 — 프론트 빌드와 /api 를 한 주소로 묶는다. 배포 서버 설정은 deploy/nginx/vori.conf.
server {
    listen 80;

    # 영수증 사진 업로드 상한(application.properties 의 요청 11MB)에 맞춘다. Nginx 기본값은 1MB.
    client_max_body_size 11m;

    root /usr/share/nginx/html;
    index index.html;

    # 화면 주소(/home, /wallet …)는 파일이 아니라 React 라우터가 그린다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        # 변수로 두면 요청 때마다 주소를 찾는다. backend 컨테이너만 다시 만들어 IP 가 바뀌어도 그대로 붙는다.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8080;
        proxy_pass $backend;

        # 포트까지 넘긴다. 빠지면 FRONTEND_PORT 를 바꿨을 때 백엔드가 같은 주소 요청을 CORS 로 보고 403 을 준다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gemini 를 기다리는 요청은 최악 약 6분 걸린다(deploy/nginx/vori.conf 와 같은 값).
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
