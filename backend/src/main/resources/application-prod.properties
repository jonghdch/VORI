# 배포 서버 설정 — 서버에서 SPRING_PROFILES_ACTIVE=prod 로 켠다. 로컬 개발은 이 파일을 쓰지 않는다.
# application.properties 위에 덮어쓰는 값만 둔다.

# SQL 로그를 끈다. 요청마다 SQL 을 정리해 콘솔에 찍으면 동시 접속 때 CPU·디스크(로그 파일)를 잡아먹는다.
# 로컬에서는 쿼리를 보며 개발하려고 켜 둔다(application.properties).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 세션 쿠키를 HTTPS 로만 보낸다 — 평문 HTTP 구간에서 쿠키가 새지 않게.
# Nginx 가 HTTPS 를 끝내고 HTTP 로 넘기므로, X-Forwarded-Proto 를 믿어야 요청이 HTTPS 로 인식된다.
# 인증서 없이 HTTP 로만 띄우는 동안에는 SESSION_COOKIE_SECURE=false 로 꺼야 로그인이 된다.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.forward-headers-strategy=native
